# JSON Schema — ICT Provider
#
# Third-party technology provider. Catalog files wrap instances in a
# top-level `ict_providers` array. This is the canonical provider
# entity. Services and offerings reference it by id (`providers`);
# they must not copy these attributes.
#
# risk_level is the canonical ICT Provider risk/severity assessment.
# Provider-to-Service links are derived from Service/Offering
# providers.
#
# Fields may support vendor-risk conversations. They are not a
# regulatory filing, not a DORA RoI or contractual-arrangement model,
# and not a real organization's vendor register.
# OSM-C-006: this entity is the ICT provider that materially delivers,
# operates, or underpins a Service/Offering — not a generic vendor
# inventory. Provenance is not a property on this schema (OSM-M-011
# candidate).

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/7lens/open-servicecatalog-model/main/schema/catalog/ict-provider.yaml
title: IctProvider
type: object
additionalProperties: false
required:
  - id
  - name
  - type
  - substitutability
properties:
  id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  name:
    type: string
    minLength: 1
  type:
    type: string
    enum:
      - cloud-infrastructure
      - cloud-platform
      - managed-service
      - software-vendor
      - network-provider
      - data-center
  headquarters:
    type: string
    description: ISO 3166-1 alpha-2 country code.
    pattern: ^[a-z]{2}$
  data_processing_locations:
    type: array
    items:
      type: string
  substitutability:
    type: string
    enum:
      - low
      - medium
      - high
  contract_ref:
    oneOf:
      - type: string
      - type: "null"
  contract_start:
    oneOf:
      - type: string
        format: date
      - type: "null"
  contract_end:
    oneOf:
      - type: string
        format: date
      - type: "null"
  notice_period_days:
    oneOf:
      - type: integer
        minimum: 0
      - type: "null"
  audit_rights:
    oneOf:
      - type: boolean
      - type: "null"
  subcontracting_allowed:
    oneOf:
      - type: boolean
      - type: string
        enum:
          - conditional
      - type: "null"
  subcontractors:
    type: array
    items:
      type: string
  last_risk_assessment:
    oneOf:
      - type: string
        format: date
      - type: "null"
  risk_level:
    description: >
      Canonical assessment of ICT Provider risk/severity.
      Not service operational_criticality and not stack
      mappings.dora.criticality.
    oneOf:
      - type: string
        enum:
          - low
          - medium
          - high
          - critical
      - type: "null"
  exit_strategy_documented:
    oneOf:
      - type: boolean
      - type: "null"
  exit_strategy_tested:
    oneOf:
      - type: boolean
      - type: "null"
  concentration_risk:
    oneOf:
      - type: boolean
      - type: "null"
  certifications:
    type: array
    items:
      type: string
  gdpr_dpa_signed:
    oneOf:
      - type: boolean
      - type: "null"
  dora_notification_clause:
    oneOf:
      - type: boolean
      - type: "null"
