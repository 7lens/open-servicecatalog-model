# JSON Schema — Service Offering
#
# An offering is the atomic requestable / deliverable unit of a Service.
# Offering ID has exactly 3 segments; the first 2 must equal the parent
# service ID. Offerings have no independent version or validity fields.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/7lens/open-servicecatalog-model/main/schema/catalog/service-offering.yaml
title: ServiceOffering
type: object
additionalProperties: false
required:
  - id
  - name
properties:
  id:
    type: string
    description: Immutable 3-segment offering identifier.
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*$
  name:
    type: string
    minLength: 1
  description:
    type: string
  characteristics:
    type: array
    description: Optional generic characteristics.
    items:
      $ref: ../shared/characteristic.yaml
  providers:
    type: array
    description: >
      Optional ICT Provider ids when provider choice is a characteristic
      of this offering. References schema/catalog/ict-provider.yaml; do not
      embed provider master data. Canonical who-provides association;
      DORA maps here. Reverse Provider → Service links are derived.
    uniqueItems: true
    items:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  provenance:
    description: Optional reusable provenance for this Offering.
    $ref: ../shared/provenance.yaml
