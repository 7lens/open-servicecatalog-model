# JSON Schema — Technology Stack
#
# A Technology Stack is an operational competency domain.
# Catalog files wrap instances in a top-level `technology_stacks` array.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/7lens/open-servicecatalog-model/main/schema/catalog/technology-stack.yaml
title: TechnologyStack
type: object
additionalProperties: false
required:
  - id
  - name
  - description
properties:
  id:
    type: string
    description: Short stable identifier; also the default service ID prefix.
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  mappings:
    type: object
    additionalProperties: false
    description: Optional reference mappings. Not a compliance claim.
    properties:
      tbm_tower:
        type: string
      tbm_sub_tower:
        type: string
      togaf_domain:
        type: string
      iso27001:
        type: string
      iso27701:
        type: string
      nist_csf:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - govern
            - identify
            - protect
            - detect
            - respond
            - recover
      gdpr:
        type: string
      dora:
        type: object
        additionalProperties: false
        properties:
          pillar:
            type: string
            enum:
              - ICT Risk Management
              - ICT-related Incident Management
              - Digital Operational Resilience Testing
              - ICT Third-Party Risk Management
          criticality:
            type: string
            enum:
              - critical
              - important
              - standard
      ai_act:
        type: object
        additionalProperties: false
        properties:
          contains_ai_systems:
            type: boolean
          max_risk_class:
            type: string
            enum:
              - unacceptable
              - high-risk
              - limited-risk
              - minimal-risk
              - not-applicable
          reference:
            type: string
