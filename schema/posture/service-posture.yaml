# JSON Schema — Service Posture
#
# Current operational / governance state of a technological service.
# Catalog files wrap instances in a top-level `service_posture` array.
# Nested `offering_posture` holds Offering Posture for each variant.
#
# Canonical OSM posture fields are unprefixed. Framework-named fields
# are optional reference mappings, not certification or compliance.
# Do not duplicate a canonical field under a framework prefix.
# DORA maps to rto, rpo, operational_criticality, resilience_tested
# and catalog `providers`. Provider association is `providers` on
# the catalog record, not a posture field.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/7lens/open-servicecatalog-model/main/schema/posture/service-posture.yaml
title: ServicePosture
type: object
additionalProperties: false
required:
  - service_id
  - offering_posture
properties:
  service_id:
    type: string
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*$
  tech_debt_score:
    description: 0-100, or null if not assessed.
    oneOf:
      - type: integer
        minimum: 0
        maximum: 100
      - type: "null"
  data_classification:
    description: >
      Classification of the data handled, processed, stored, or
      exposed by the service. Same enum tokens as
      security_classification; different subject (data, not the
      service itself).
    type: string
    enum:
      - public
      - internal
      - confidential
      - restricted
  vendor_support_status:
    type: string
    enum:
      - active
      - extended
      - end-of-life
  operational_criticality:
    description: Canonical operational criticality of the service. DORA maps to this field.
    type: string
    enum:
      - critical
      - important
      - standard
  resilience_tier:
    description: >
      Qualitative resilience classification/tier for the service.
      Not a service taxonomy and not a replacement for offering
      rto / rpo (explicit recovery objectives).
    type: string
    minLength: 1
  availability_target:
    description: >
      Expected/target level of service availability (e.g. 99.9%).
      A performance target, not the hours window (that is the
      service_hours characteristic). Not an SLA object.
    type: string
    minLength: 1
  response_target:
    description: >
      Expected target time for responding to an incident or request
      (ISO 8601 duration). A performance target, not support_hours.
      Not an SLA object.
    type: string
    minLength: 1
  resolution_target:
    description: >
      Expected target time for resolving an incident or request
      (ISO 8601 duration). A performance target, not service_hours
      or support_hours. Not an SLA object.
    type: string
    minLength: 1
  security_classification:
    description: >
      Security sensitivity/classification of the service itself.
      Same enum tokens as data_classification; different subject
      (the service, not the data it handles).
    type: string
    enum:
      - public
      - internal
      - confidential
      - restricted
  privacy_classification:
    type: string
    enum:
      - none
      - pii
      - sensitive
      - not-assessed
  financial_owner:
    description: >
      Person or role responsible for the financial ownership of this
      service. Distinct from Service `accountable` (service-definition
      accountability). Not a finance system.
    type: string
    minLength: 1
  provenance:
    description: Optional reusable provenance for this posture record.
    $ref: ../shared/provenance.yaml
  ai_act_applicable:
    type: boolean
  ai_act_risk_class:
    type: string
    enum:
      - unacceptable
      - high-risk
      - limited-risk
      - minimal-risk
      - not-applicable
  offering_posture:
    type: array
    items:
      $ref: "#/$defs/OfferingPosture"

$defs:
  OfferingPosture:
    type: object
    additionalProperties: false
    required:
      - offering_id
    properties:
      offering_id:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*$
      cost_pool:
        oneOf:
          - type: string
          - type: "null"
      chargeback_model:
        type: string
        enum:
          - shared
          - dedicated
          - consumption
      unit_cost:
        description: Optional unit-cost characterization. Not a transaction or invoice.
        oneOf:
          - type: number
            minimum: 0
          - type: "null"
      automation_coverage:
        description: >
          Degree to which the overall delivery and operation of the
          offering is automated. Same enum as provisioning_automation;
          different scope (overall operation, not the provisioning
          process).
        oneOf:
          - type: string
            enum:
              - none
              - partial
              - full
          - type: "null"
      provisioning_automation:
        description: >
          Degree to which the provisioning process specifically is
          automated. Same enum as automation_coverage; different
          scope (provisioning, not overall delivery/operation).
        oneOf:
          - type: string
            enum:
              - none
              - partial
              - full
          - type: "null"
      self_service:
        oneOf:
          - type: boolean
          - type: "null"
      manual_hours_week:
        oneOf:
          - type: number
            minimum: 0
          - type: "null"
      last_security_review:
        oneOf:
          - type: string
            format: date
          - type: "null"
      asset_coverage:
        oneOf:
          - type: string
            enum:
              - complete
              - partial
              - unknown
          - type: "null"
      iso27001_controls:
        type: array
        items:
          type: string
      iso27701_pii_role:
        type: string
        enum:
          - controller
          - processor
          - joint-controller
          - none
      iso27701_pii_categories:
        type: array
        items:
          type: string
          enum:
            - identity
            - financial
            - health
            - behavioral
            - location
            - biometric
            - communications
            - none
      iso27701_retention_days:
        oneOf:
          - type: integer
            minimum: 0
          - type: "null"
      nist_functions:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
            - govern
            - identify
            - protect
            - detect
            - respond
            - recover
      nist_control_status:
        oneOf:
          - type: string
            enum:
              - implemented
              - partially-implemented
              - planned
              - not-applicable
          - type: "null"
      gdpr_processing_activity:
        type: boolean
      gdpr_dpia_required:
        type: boolean
      gdpr_erasure_capable:
        oneOf:
          - type: boolean
          - type: string
            enum:
              - partial
              - not-applicable
      rto:
        description: >
          Recovery Time Objective (ISO 8601 duration). Explicit
          recovery target. Distinct from service resilience_tier
          (qualitative classification).
        oneOf:
          - type: string
          - type: "null"
      rpo:
        description: >
          Recovery Point Objective (ISO 8601 duration). Explicit
          recovery target. Distinct from service resilience_tier
          (qualitative classification).
        oneOf:
          - type: string
          - type: "null"
      resilience_tested:
        description: Canonical resilience-test posture.
        oneOf:
          - type: boolean
          - type: "null"
      last_resilience_test:
        oneOf:
          - type: string
            format: date
          - type: "null"
      resilience_evidence:
        description: Handle or URI for resilience evidence. Not a GRC control library.
        oneOf:
          - type: string
          - type: "null"
      provenance:
        description: Optional reusable provenance for this offering posture row.
        $ref: ../shared/provenance.yaml
      ai_act_intended_purpose:
        type: string
      ai_act_human_oversight:
        type: string
        enum:
          - human-in-the-loop
          - human-on-the-loop
          - human-in-command
          - none
      ai_act_transparency_level:
        type: string
        enum:
          - explicit-disclosure
          - implicit-disclosure
          - none
      ai_act_conformity_assessment:
        oneOf:
          - type: string
            format: date
          - type: "null"
      ai_act_training_data_doc:
        oneOf:
          - type: boolean
          - type: string
            enum:
              - not-applicable
