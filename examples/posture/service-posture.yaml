# Example Service Posture
#
# SYNTAX TUTORIAL. Synthetic posture samples. Values are fictional and
# chosen to show field patterns. They are NOT assessed enterprise
# posture and must not be copied as operational truth.
#
# `service_posture` / `offering_posture` are the Service Posture
# and Offering Posture records.
#
# Canonical OSM posture fields are unprefixed. Framework-named fields
# are OPTIONAL REFERENCE MAPPINGS, not legal advice and not evidence
# of compliance or certification. `nist_control_status` is an OSM
# assessment signal, not a NIST CSF object or control-catalogue entry.
# `ai_act_risk_class` is an OSM label, not Article 6 / Annex III.
# Do not duplicate a canonical field under a framework prefix. Same
# enum tokens do not mean the same concept (data vs security
# classification; automation vs provisioning automation).

