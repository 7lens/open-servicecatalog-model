  - id: auto.aiops
    name: AIOps
    description: AIOps and autonomous operations. Source classified this as AI-bearing.
    accountable: Service Owner
    technology_stack: Automation
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: pilot
    provenance:
      authoritative_source: Service Owner
      source_system: predecessor-catalog
      source_record_id: auto.aiops
      confidence: high
      discovery_method: imported
    service_offerings:
      - id: auto.aiops.aiops
        name: Managed AIOps / autonomous operations
        characteristics:
          - name: operating_model
            value_type: string
            description: >
              Source listed cloud and on-prem as where this offering
              can run. Not a duplicate of provider identity (do not
              use a cloud vendor name as the characteristic value).
            allowed_values: [cloud, on-prem]
            configurable: true
