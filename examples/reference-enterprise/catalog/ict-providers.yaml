# Reference-enterprise ICT Providers
#
# Sellers taken from the predecessor catalog for the promoted services.
# Source split Microsoft Azure and Microsoft Productivity/Identity into
# two rows; OSM uses one legal seller (`microsoft`).
#
# Source `criticality` and `services_consumed` are not OSM fields.
# Source `gdpr_dpa_signed: true` is not copied: OSM means the customer
# executed the DPA, which the predecessor catalog did not evidence.
#
# certifications[] are provider-level published program names.
# They do not mean that every provider service, customer deployment,
# region, or OSM Service is certified.

