# Reference-enterprise Services
#
# Technological services derived from a predecessor enterprise catalog.
# Vendor products are Offerings. IDs follow OSM (2-segment Service,
# 3-segment Offering). Original product IDs are in provenance and
# traceability.md — they are not reused when they named a product.
#
# OSM requires lifecycle_state, version and valid_from on every Service.
# Only auto.aiops.lifecycle_state (pilot) is source-derived. Other
# Services use draft: the predecessor did not establish production.
# version / valid_from are cataloguing metadata, not operational facts.
#
# Request types (MFA, password reset, directory lifecycle) are not
# Offerings.

services:
- id: lz.landing-zone
  name: Cloud Landing Zone
  description: >
    Account/subscription lifecycle and guardrails. Source listed a generic landing-zone service
    plus one Service per cloud. OSM uses one Service and per-cloud Offerings.
  accountable: Service Owner
  technology_stack: Landing Zone
  version: "1.0.0"
  valid_from: 2026-01-01
  valid_to: null
  lifecycle_state: draft
  provenance:
    authoritative_source: Service Owner
    source_system: predecessor-catalog
    confidence: high
    discovery_method: imported
    evidence_reference: predecessor://services#lz.landing-zone+lz.lz-aws+lz.lz-azure+lz.lz-gcp+lz.lz-datacenter
  service_offerings:
  - id: lz.landing-zone.aws
    name: Managed landing zone (AWS)
    providers:
    - aws
  - id: lz.landing-zone.azure
    name: Managed landing zone (Azure)
    providers:
    - microsoft
  - id: lz.landing-zone.gcp
    name: Managed landing zone (GCP)
    providers:
    - gcp
  - id: lz.landing-zone.datacenter
    name: Managed landing zone (on-prem data center)
