- id: db.managed-relational
  name: Managed Relational Database
  description: >
    Managed relational database service. Source catalogued each engine product as a Service.
    Representative Offerings only.
  accountable: Service Owner
  technology_stack: Database
  version: "1.0.0"
  valid_from: 2026-01-01
  valid_to: null
  lifecycle_state: draft
  provenance:
    authoritative_source: Service Owner
    source_system: predecessor-catalog
    confidence: high
    discovery_method: imported
    evidence_reference: predecessor://services#db.rds-oracle+db.rds-postgresql+db.azure-sql+db.aurora-postgresql
  service_offerings:
  - id: db.managed-relational.rds-oracle
    name: Managed RDS Oracle
    providers:
    - aws
    # Oracle is the engine licensor, not the ICT Provider that
    # operates RDS. Engine identity is the `engine` characteristic.
    # Do not list licensors on providers[] unless they materially
    # deliver or underpin the offering (OSM-C-006).
    characteristics:
    - name: engine
      value_type: string
      value: oracle
      configurable: false
    provenance:
      authoritative_source: Service Owner
      source_system: predecessor-catalog
      source_record_id: db.rds-oracle.rds-oracle
      confidence: high
      discovery_method: imported
  - id: db.managed-relational.rds-postgresql
    name: Managed RDS PostgreSQL
    providers:
    - aws
    characteristics:
    - name: engine
      value_type: string
      value: postgresql
      configurable: false
  - id: db.managed-relational.azure-sql
    name: Managed Azure SQL Database
    providers:
    - microsoft
    characteristics:
    - name: engine
      value_type: string
      value: sql-server
      configurable: false
  - id: db.managed-relational.aurora-postgresql
    name: Managed Aurora PostgreSQL
    providers:
    - aws
    characteristics:
    - name: engine
      value_type: string
      value: aurora-postgresql
      configurable: false
