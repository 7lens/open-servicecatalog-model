# Example Services
#
# SYNTAX TUTORIAL. This catalog is synthetic. It shows YAML shape
# (identity, version/validity, nested offerings, characteristics,
# providers). Modelling follows the same core rules as
# examples/reference-enterprise/golden-example/:
#
#   Service  = technological service (not a product, not a request)
#   Offering = meaningful technological variant (provider/product/engine)
#   providers[] on the Offering when the seller distinguishes the variant
#   Characteristic is not a substitute for provider identity
#   Posture is current customer/service state (see examples/posture/)
#
# lifecycle_state, version and valid_from are required catalog metadata
# in this tutorial; they are not sourced operational truth.
# Do not copy request-catalogue grains (MFA, password reset) as Offerings.
#
# Service ID = 2 segments. Offering ID = 3 segments.
# `providers` lists ICT Provider ids (see ict-providers.yaml).

services:

  - id: compute.virtual-machines
    name: Virtual Machines
    description: Provisioned virtual machines with lifecycle and patching.
    accountable: Service Owner
    technology_stack: Compute
    version: "1.0.0"
    valid_from: 2025-01-01
    valid_to: null
    lifecycle_state: production
    service_offerings:
      - id: compute.virtual-machines.aws
        name: Virtual machines (AWS)
        providers: [aws]
      - id: compute.virtual-machines.azure
        name: Virtual machines (Azure)
        providers: [microsoft]

  - id: compute.kubernetes
    name: Kubernetes
    description: Managed Kubernetes clusters offered as a technological service.
    accountable: Service Owner
    technology_stack: Compute
    version: "1.1.0"
    valid_from: 2025-04-01
    valid_to: null
    lifecycle_state: production
    characteristics:
      - name: orchestration_api
        value_type: string
        description: Kubernetes API compatibility advertised by the service definition.
        allowed_values: ["1.28", "1.29", "1.30"]
        default_value: "1.29"
        value: "1.29"
        min_cardinality: 1
        max_cardinality: 1
        configurable: false
    provenance:
      authoritative_source: Service Owner
      source_system: osm-catalog
      source_record_id: compute.kubernetes
      last_verified: 2025-09-01
      evidence_reference: synthetic://catalog/compute.kubernetes
      confidence: high
      discovery_method: declared
    service_offerings:
      - id: compute.kubernetes.aws
        name: AWS
        providers: [aws]
        characteristics:
          # Syntax sample: delivery stage, not cloud identity.
          - name: delivery_stage
            value_type: string
            description: Illustrative delivery stage of this offering (not the cloud/provider).
            allowed_values: [production, development]
            value: production
            default_value: production
            min_cardinality: 1
            max_cardinality: 1
            configurable: false
          - name: service_hours
            value_type: string
            description: >
              Time window during which the service is intended to be
              available. Distinct from availability_target (expected
              performance).
            value: 24x7
            configurable: false
          - name: support_hours
            value_type: string
            description: >
              Time window during which support is available. Distinct
              from response_target and resolution_target.
            value: 24x7
            configurable: false
          - name: pricing_model
            value_type: string
            description: How consumption of this offering is priced.
            allowed_values: [subscription, consumption]
            value: consumption
            configurable: false
          - name: unit_of_consumption
            value_type: string
            description: Unit used to characterize consumption.
            value: cluster-hour
            configurable: false
      - id: compute.kubernetes.azure
        name: Azure
        providers: [microsoft]
        characteristics:
          - name: delivery_stage
            value_type: string
            description: Illustrative delivery stage of this offering (not the cloud/provider).
            allowed_values: [production, development]
            value: production
            default_value: production
            min_cardinality: 1
            max_cardinality: 1
            configurable: false
          - name: service_hours
            value_type: string
            value: 24x7
            configurable: false
          - name: support_hours
            value_type: string
            value: business-hours
            configurable: false
          - name: pricing_model
            value_type: string
            allowed_values: [subscription, consumption]
            value: subscription
            configurable: false
          - name: unit_of_consumption
            value_type: string
            value: cluster-month
            configurable: false

