# Example ICT Providers
#
# SYNTAX TUTORIAL. Small synthetic register of well-known public
# providers. This is not a real vendor register, not a recommended
# supplier list, and not a regulatory filing. Contract, risk and
# resilience fields are left unset on purpose.
#
# The legal seller of Azure services is `microsoft`, not `azure`.
#
# certifications[] are provider-level published program names.
# They do not mean that every provider service, customer deployment,
# region, or OSM Service is certified.
#
# risk_level is the canonical ICT Provider risk/severity field.
# Provider-to-Service links are derived from catalog `providers`.

