# Reference-estate Service Posture
#
# Intentionally thin. Customer-dependent operational_criticality, rto,
# rpo, data_classification, cost and resilience tests are omitted.
# vendor_support_status is recorded only where the product is generally
# available.
#
# `service_posture` / `offering_posture` are the current public OSM
# vocabulary.
#
# AI Act fields on data.vendor-ai-assist record that vendor-operated AI
# features exist. They are not a legal classification.

service_posture:

  - service_id: compute.virtual-machines
    vendor_support_status: active
    privacy_classification: not-assessed
    ai_act_applicable: false
    ai_act_risk_class: not-applicable
    provenance:
      authoritative_source: Service Owner
      source_system: osm-catalog
      last_verified: 2026-09-13
      evidence_reference: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
      confidence: high
      discovery_method: declared
    offering_posture: []

