  - id: identity.cloud-authorization
    name: Cloud Platform Authorization
    description: >
      Account, project or resource authorization for a cloud platform
      (AWS IAM). This is not an enterprise directory or IdP. Do not
      unify with Entra ID or Okta.
    accountable: Service Owner
    technology_stack: Identity
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://aws.amazon.com/iam/
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: identity.cloud-authorization.aws-iam
        name: AWS IAM
        description: >
          AWS Identity and Access Management. Distinct from IAM
          Identity Center. No public availability SLA found.
        providers: [aws]
        provenance:
          authoritative_source: Amazon Web Services
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://aws.amazon.com/iam/
          confidence: high
          discovery_method: manual

  - id: collab.issue-tracking
    name: Issue Tracking
    description: Issue and work-item tracking as a technological service.
    accountable: Service Owner
    technology_stack: Collaboration
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    providers: [atlassian]
    provenance:
      authoritative_source: Atlassian
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://www.atlassian.com/trust/compliance
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: collab.issue-tracking.jira-cloud
        name: Jira Cloud
        providers: [atlassian]
        characteristics:
          - name: deployment_model
            value_type: string
            allowed_values: [cloud, data-center]
            value: cloud
            configurable: false
          - name: data_residency_option
            value_type: string
            description: >
              Pin locations are published; selected pin is customer-dependent.
              In-scope app data only.
            value: pin-or-global
            configurable: true
      - id: collab.issue-tracking.jira-data-center
        name: Jira Data Center
        description: >
          Self-managed. Atlassian Cloud ISO/SOC evidence does not cover
          this offering.
        providers: [atlassian]
        characteristics:
          - name: deployment_model
            value_type: string
            allowed_values: [cloud, data-center]
            value: data-center
            configurable: false

