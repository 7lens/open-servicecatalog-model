    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://learn.microsoft.com/en-us/entra/fundamentals/whatis
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: identity.directory-idp.entra-id
        name: Microsoft Entra ID
        description: >
          Enterprise identity service underpinning Microsoft 365, Azure
          and Dynamics. Shared substrate, not an Azure-only product.
        providers: [microsoft]
        provenance:
          authoritative_source: Microsoft
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://learn.microsoft.com/en-us/entra/fundamentals/whatis
          confidence: high
