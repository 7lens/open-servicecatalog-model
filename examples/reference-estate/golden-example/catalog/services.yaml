# Golden-example Services
#
# Ten technological services. Vendor products are Offerings.
# Learn this chain:
#   Service → Offering → ICT Provider → Characteristics
#   → Service Posture → Provenance
#
# Vendor SLAs are characteristics (`vendor_availability_sla`).
# Customer criticality, RTO/RPO and signed-contract flags are not here.

services:

  - id: compute.virtual-machines
    name: Virtual Machines
    description: >
      On-demand virtual-machine compute offered as a technological
      service. Amazon EC2, Azure Virtual Machines and Google Compute
      Engine are offerings of this service, not three OSM Services.
    accountable: Service Owner
    technology_stack: Compute
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      source_record_id: compute.virtual-machines
      last_verified: 2026-09-13
      evidence_reference: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: compute.virtual-machines.aws-ec2
        name: Amazon EC2
        description: >
          Amazon Elastic Compute Cloud — on-demand scalable computing
          capacity in the AWS Cloud.
        providers: [aws]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: >
              Vendor credit SLA, not the enterprise availability_target.
              Region-level 99.99% when instances span two or more AZs;
              instance-level 99.5%. Configuration-conditional.
            value: "99.99%-multi-az-region / 99.5%-instance"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Amazon Web Services
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://aws.amazon.com/compute/sla/
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.azure-vm
        name: Azure Virtual Machines
        description: IaaS virtual machines in Microsoft Azure.
        providers: [microsoft]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: >
              Conditional on availability zones / availability sets /
              disk type. Authoritative text is the Online Services SLA.
            value: "99.99%-two-vms-two-azs-conditional"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Microsoft
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.gce
        name: Google Compute Engine
        description: Virtual machines on Google Cloud.
        providers: [google-cloud]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            value: "see-compute-sla-instance-and-region-classes"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Google Cloud
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://cloud.google.com/compute/sla
          confidence: high
          discovery_method: manual

  - id: compute.kubernetes
    name: Managed Kubernetes
    description: >
      Kubernetes clusters offered as a technological service. This is
      not the CNCF Kubernetes project. Self-operated clusters are an
      offering with no ICT Provider.
    accountable: Service Owner
    technology_stack: Compute
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    characteristics:
      - name: orchestration_api
        value_type: string
        description: Kubernetes API compatibility advertised by the service definition.
        configurable: false
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://aws.amazon.com/eks/
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: compute.kubernetes.aws-eks
        name: Amazon EKS
        providers: [aws]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: Control-plane endpoint SLA. Worker nodes are under Compute SLA.
            value: "99.95%-standard-control-plane / 99.99%-provisioned"
            configurable: false
          - name: service_hours
            value_type: string
            description: >
              Time window during which the service is intended to be
              available. Distinct from availability_target and from
              vendor_availability_sla.
            value: 24x7
            configurable: false
          - name: support_hours
            value_type: string
            description: >
              Time window during which support is available. Distinct
              from response_target and resolution_target.
            value: 24x7
            configurable: false
        provenance:
          authoritative_source: Amazon Web Services
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://aws.amazon.com/eks/sla/
          confidence: high
          discovery_method: manual
      - id: compute.kubernetes.azure-aks
        name: Azure Kubernetes Service
        providers: [microsoft]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: Free tier has no financially backed SLA.
            value: "99.95%-standard-with-az / 99.9%-standard-without-az / none-free-tier"
            configurable: false
        provenance:
          authoritative_source: Microsoft
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://learn.microsoft.com/en-us/azure/aks/free-standard-pricing-tiers
          confidence: high
          discovery_method: manual
      - id: compute.kubernetes.self-operated
        name: Self-operated Kubernetes
        description: >
          Customer-operated clusters. No ICT Provider. Upstream
          Kubernetes is a project, not a provider.
        characteristics:
          - name: operating_model
            value_type: string
            allowed_values: [self-operated]
            value: self-operated
            configurable: false

  - id: storage.object-storage
    name: Object Storage
    description: >
      Object storage for unstructured data. Amazon S3 and Azure Blob
      Storage are offerings of this service, not two OSM Services.
    accountable: Service Owner
    technology_stack: Storage
    version: "1.0.0"
    valid_from: 2026-01-01
    valid_to: null
    lifecycle_state: production
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://aws.amazon.com/s3/
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: storage.object-storage.aws-s3
        name: Amazon S3
        description: Amazon Simple Storage Service.
        providers: [aws]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: >
              Credit SLA by storage class. Distinct from S3 durability
              design claims.
            value: "99.9%-standard-class / 99.0%-infrequent-access-classes"
            configurable: false
          - name: storage_class_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Amazon Web Services
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://aws.amazon.com/s3/sla/
          confidence: high
          discovery_method: manual
      - id: storage.object-storage.azure-blob
        name: Azure Blob Storage
        providers: [microsoft]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            value: "redundancy-and-tier-conditional"
            configurable: false
        provenance:
          authoritative_source: Microsoft
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
          confidence: high
          discovery_method: manual

