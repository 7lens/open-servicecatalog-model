# Investigation ICT Providers
#
# Publicly researched third-party organisations. Not a customer vendor
# register. Contract, signed-DPA, DORA-clause, risk_level, exit and
# last_risk_assessment fields are null because they are customer-
# dependent (evidence class C).
#
# certifications[] lists published program names only. Scope lives in
# provenance.evidence_reference and in research_matrix.md. A listed
# token is NOT certification of every service, region or edition.
#
# subcontractors is empty: public subprocessor lists exist but the
# applicable subset is customer/service/region dependent. URLs are in
# provenance.
#
# substitutability for AWS and Microsoft is a Flexera 2025 market
# observation (low switching at hyperscaler grain), not a customer
# score. Other values are conservative medium observations.

