# Investigation Services
#
# Capability-first encoding: the OSM Service is the technological
# service an enterprise would catalog; vendor products are Offerings
# (or intrinsic providers). This file is a model test suite, not a
# product inventory and not a real estate.
#
# accountable is a placeholder. lifecycle_state is draft.
# Vendor SLAs are characteristics, not availability_target.
# Customer criticality / RTO / RPO / classification are not set here.

services:

  - id: compute.virtual-machines
    name: Virtual Machines
    description: >
      On-demand virtual-machine compute offered as a technological
      service. Vendor products in scope for this investigation are
      Amazon EC2, Azure Virtual Machines, Google Compute Engine,
      OCI Compute and Alibaba Cloud ECS.
    accountable: Reference Estate Service Owner
    technology_stack: Compute
    version: "0.1.0-investigation"
    valid_from: 2026-09-13
    valid_to: null
    lifecycle_state: draft
    provenance:
      authoritative_source: Vendor product documentation
      source_system: public-web
      source_record_id: compute.virtual-machines
      last_verified: 2026-09-13
      evidence_reference: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
      confidence: high
      discovery_method: manual
    service_offerings:
      - id: compute.virtual-machines.aws-ec2
        name: Amazon EC2
        description: >
          Amazon Elastic Compute Cloud — on-demand scalable computing
          capacity in the AWS Cloud.
        providers: [aws]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: >
              Vendor credit SLA, not the enterprise availability_target.
              Region-level 99.99% when instances span two or more AZs;
              instance-level 99.5%. Configuration-conditional.
            value: "99.99%-multi-az-region / 99.5%-instance"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Amazon Web Services
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://aws.amazon.com/compute/sla/
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.azure-vm
        name: Azure Virtual Machines
        description: IaaS virtual machines in Microsoft Azure.
        providers: [microsoft]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            description: >
              Conditional on availability zones / availability sets /
              disk type. Authoritative text is the Online Services SLA.
            value: "99.99%-two-vms-two-azs-conditional"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Microsoft
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.gce
        name: Google Compute Engine
        description: Virtual machines on Google Cloud.
        providers: [google-cloud]
        characteristics:
          - name: vendor_availability_sla
            value_type: string
            value: "see-compute-sla-instance-and-region-classes"
            configurable: false
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Google Cloud
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://cloud.google.com/compute/sla
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.oci
        name: OCI Compute
        description: Oracle Cloud Infrastructure compute instances.
        providers: [oracle]
        characteristics:
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Oracle
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://docs.oracle.com/en-us/iaas/Content/Compute/Concepts/computeoverview.htm
          confidence: high
          discovery_method: manual
      - id: compute.virtual-machines.alibaba-ecs
        name: Alibaba Cloud ECS
        description: Elastic Compute Service virtual machines.
        providers: [alibaba-cloud]
        characteristics:
          - name: region_selectable
            value_type: boolean
            value: true
            configurable: true
        provenance:
          authoritative_source: Alibaba Cloud
          source_system: public-web
          last_verified: 2026-09-13
          evidence_reference: https://www.alibabacloud.com/help/en/ecs/user-guide/regions-and-zones
          confidence: high
          discovery_method: manual

