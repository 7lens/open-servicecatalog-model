# Investigation Service Posture
#
# Intentionally thin. Customer-dependent criticality, RTO/RPO,
# classification, cost, automation coverage and resilience tests are
# not filled. vendor_support_status is set only where the product is
# generally available as of 2026-09-13.
#
# AI Act fields on data.vendor-ai-assist record that vendor-operated
# AI features exist. They are not a legal classification.

service_posture:

  - service_id: compute.virtual-machines
    vendor_support_status: active
    privacy_classification: not-assessed
    ai_act_applicable: false
    ai_act_risk_class: not-applicable
    provenance:
      authoritative_source: Investigation — public GA status only
      source_system: public-web
      last_verified: 2026-09-13
      evidence_reference: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
      confidence: high
      discovery_method: manual
    offering_posture: []

